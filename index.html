<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f13">
  <title>קלוריות AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

<!-- ===== APP SHELL ===== -->
<div id="app">

  <!-- TOP BAR -->
  <header class="top-bar">
    <h1 class="app-title">🥗 קלוריות AI</h1>
    <button class="icon-btn" onclick="openGoals()" title="יעדים יומיים">⚙️</button>
  </header>

  <!-- VIEWS -->
  <main class="main-content">

    <!-- DASHBOARD -->
    <div id="view-dashboard" class="view active">
      <div class="date-display" id="today-date"></div>
      
      <!-- MAIN CALORIES RING -->
      <div class="main-ring-container">
        <svg class="ring-svg main-ring" viewBox="0 0 80 80">
          <circle cx="40" cy="40" r="34" fill="none" stroke="#1e1e2a" stroke-width="8"/>
          <circle id="cal-ring" cx="40" cy="40" r="34" fill="none" stroke="#f97316" stroke-width="8"
                  stroke-linecap="round" transform="rotate(-90 40 40)"/>
        </svg>
        <div class="ring-label">
          <span class="ring-value" id="cal-value">0</span>
          <span class="ring-unit">קלוריות</span>
        </div>
      </div>

      <!-- MACROS -->
      <div class="macros-row">
        <div class="macro-card protein">
          <svg class="ring-svg small-ring" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="28" fill="none" stroke="#1e1e2a" stroke-width="6"/>
            <circle id="protein-ring" cx="32" cy="32" r="28" fill="none" stroke="#3b82f6" stroke-width="6"
                    stroke-linecap="round" transform="rotate(-90 32 32)"/>
          </svg>
          <div class="macro-info">
            <span class="macro-val" id="protein-value">0</span>
            <span class="macro-unit">g חלבון</span>
          </div>
        </div>
        <div class="macro-card carbs">
          <svg class="ring-svg small-ring" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="28" fill="none" stroke="#1e1e2a" stroke-width="6"/>
            <circle id="carbs-ring" cx="32" cy="32" r="28" fill="none" stroke="#22c55e" stroke-width="6"
                    stroke-linecap="round" transform="rotate(-90 32 32)"/>
          </svg>
          <div class="macro-info">
            <span class="macro-val" id="carbs-value">0</span>
            <span class="macro-unit">g פחממות</span>
          </div>
        </div>
        <div class="macro-card fat">
          <svg class="ring-svg small-ring" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="28" fill="none" stroke="#1e1e2a" stroke-width="6"/>
            <circle id="fat-ring" cx="32" cy="32" r="28" fill="none" stroke="#eab308" stroke-width="6"
                    stroke-linecap="round" transform="rotate(-90 32 32)"/>
          </svg>
          <div class="macro-info">
            <span class="macro-val" id="fat-value">0</span>
            <span class="macro-unit">g שומן</span>
          </div>
        </div>
      </div>

      <!-- QUICK ADD BUTTON -->
      <div class="quick-add-area">
        <button class="fab-main" onclick="openAddFood()">
          <span class="fab-icon">+</span>
          <span class="fab-text">הוסף ארוחה</span>
        </button>
      </div>

      <!-- TODAY'S LOG PREVIEW -->
      <div class="today-preview">
        <h3>ארוחות היום</h3>
        <div id="today-preview-list"></div>
      </div>
    </div>

    <!-- LOG VIEW -->
    <div id="view-log" class="view">
      <h2 class="view-title">יומן תזונה</h2>
      <div id="log-entries"></div>
    </div>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="dashboard" onclick="showView('dashboard')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">ראשי</span>
    </button>
    <button class="nav-btn" data-view="log" onclick="showView('log')">
      <span class="nav-icon">📋</span>
      <span class="nav-label">יומן</span>
    </button>
  </nav>
</div>

<!-- ===== MODALS ===== -->

<!-- ADD FOOD CHOICE MODAL -->
<div id="add-food-modal" class="modal-overlay" onclick="if(event.target===this)closeAddFood()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h2 class="modal-title">הוסף ארוחה</h2>
    <div class="add-options">
      <button class="add-option-btn camera-btn" onclick="openCamera()">
        <div class="option-icon">📷</div>
        <div class="option-text">
          <strong>צלם ארוחה</strong>
          <span>AI מנתח ומחשב קלוריות</span>
        </div>
        <span class="option-arrow">›</span>
      </button>
      <button class="add-option-btn barcode-btn" onclick="openBarcode()">
        <div class="option-icon">🔍</div>
        <div class="option-text">
          <strong>סרוק ברקוד</strong>
          <span>חפש מוצר לפי ברקוד</span>
        </div>
        <span class="option-arrow">›</span>
      </button>
      <button class="add-option-btn manual-btn" onclick="openManualEntry()">
        <div class="option-icon">✏️</div>
        <div class="option-text">
          <strong>הזנה ידנית</strong>
          <span>חפש מזון לפי שם</span>
        </div>
        <span class="option-arrow">›</span>
      </button>
    </div>
  </div>
</div>

<!-- CAMERA MODAL -->
<div id="camera-modal" class="modal-overlay" onclick="if(event.target===this)closeCameraModal()">
  <div class="modal-full">
    <div class="modal-header">
      <button class="back-btn" onclick="closeCameraModal()">‹ חזרה</button>
      <h2>📷 צלם ארוחה</h2>
      <div></div>
    </div>
    <div class="camera-container">
      <video id="camera-video" autoplay playsinline></video>
      <img id="camera-preview" style="display:none" alt="תצוגה מקדימה">
      <canvas id="camera-canvas" style="display:none"></canvas>
      <div id="camera-error" class="error-banner" style="display:none"></div>
    </div>
    <div class="camera-controls">
      <button id="upload-btn-camera" class="btn-secondary" onclick="triggerPhotoUpload()">📁 העלה תמונה</button>
      <button id="capture-btn" class="capture-button" onclick="capturePhoto()">
        <div class="capture-inner"></div>
      </button>
      <div style="width:80px"></div>
    </div>
    <input type="file" id="photo-file-input" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">
    <div id="camera-result" style="display:none" class="result-panel"></div>
  </div>
</div>

<!-- BARCODE MODAL -->
<div id="barcode-modal" class="modal-overlay" onclick="if(event.target===this)closeBarcodeModal()">
  <div class="modal-full">
    <div class="modal-header">
      <button class="back-btn" onclick="closeBarcodeModal()">‹ חזרה</button>
      <h2>🔍 סרוק ברקוד</h2>
      <div></div>
    </div>
    <div class="camera-container barcode-container">
      <video id="barcode-video" autoplay playsinline></video>
      <div class="barcode-overlay">
        <div class="barcode-frame">
          <div class="scan-line"></div>
        </div>
        <p class="scan-hint">כוון את הברקוד למסגרת</p>
      </div>
      <div id="barcode-error" class="error-banner" style="display:none"></div>
    </div>
    <div id="manual-barcode-input" class="manual-input-row" style="display:none">
      <input type="number" id="barcode-manual-input" placeholder="הזן מספר ברקוד..." class="text-input">
      <button class="btn-primary" onclick="lookupManualBarcode()">חפש</button>
    </div>
    <div id="barcode-result" style="display:none" class="result-panel"></div>
  </div>
</div>

<!-- MANUAL ENTRY MODAL -->
<div id="manual-modal" class="modal-overlay" onclick="if(event.target===this)closeManualModal()">
  <div class="modal-sheet tall">
    <div class="modal-handle"></div>
    <div class="modal-header-inner">
      <button class="back-btn" onclick="closeManualModal()">‹</button>
      <h2>✏️ הזנה ידנית</h2>
    </div>
    <div class="search-row">
      <input type="text" id="manual-search" placeholder="חפש מזון... (עגבניה, עוף, לחם)" class="text-input">
      <button class="btn-primary" onclick="searchFoodManual()">🔎</button>
    </div>
    <div id="manual-results" class="search-results"></div>
    <div id="manual-add-section" style="display:none" class="manual-add-form">
      <label>כמות (גרם):</label>
      <input type="number" id="manual-grams" value="100" min="1" class="text-input small">
      <button class="btn-add-confirm" onclick="addManualFood()">✅ הוסף ליומן</button>
    </div>
  </div>
</div>

<!-- GOALS MODAL -->
<div id="goals-modal" class="modal-overlay" onclick="if(event.target===this)closeGoals()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h2 class="modal-title">⚙️ יעדים יומיים</h2>
    <div class="goals-form">
      <div class="goal-row">
        <label>🔥 קלוריות</label>
        <input type="number" id="goal-calories" class="text-input small">
      </div>
      <div class="goal-row">
        <label>💪 חלבון (g)</label>
        <input type="number" id="goal-protein" class="text-input small">
      </div>
      <div class="goal-row">
        <label>🌾 פחממות (g)</label>
        <input type="number" id="goal-carbs" class="text-input small">
      </div>
      <div class="goal-row">
        <label>🧈 שומן (g)</label>
        <input type="number" id="goal-fat" class="text-input small">
      </div>
      <button class="btn-add-confirm" onclick="saveGoals()">💾 שמור</button>
    </div>
  </div>
</div>

<!-- EDIT FOOD MODAL -->
<div id="edit-food-modal" class="modal-overlay" onclick="if(event.target===this)closeEditModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h2 class="modal-title">✏️ ערוך ערכים</h2>
    <div class="goals-form">
      <div class="goal-row">
        <label>שם</label>
        <input type="text" id="edit-name" class="text-input small">
      </div>
      <div class="goal-row">
        <label>קלוריות</label>
        <input type="number" id="edit-calories" class="text-input small">
      </div>
      <div class="goal-row">
        <label>חלבון (g)</label>
        <input type="number" id="edit-protein" class="text-input small">
      </div>
      <div class="goal-row">
        <label>פחממות (g)</label>
        <input type="number" id="edit-carbs" class="text-input small">
      </div>
      <div class="goal-row">
        <label>שומן (g)</label>
        <input type="number" id="edit-fat" class="text-input small">
      </div>
      <button class="btn-add-confirm" onclick="saveEditedFood()">✅ הוסף ליומן</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  // Set today's date
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('he-IL', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
